[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stonecharts"
version = "0.0.0.5"
description = "StoneCharts — original, proprietary interactive charting library (Python edition)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary — All Rights Reserved" }
authors = [{ name = "Dharmik Shingala" }]
keywords = ["charts", "svg", "visualization", "plotting"]
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
dependencies = []

[project.scripts]
stoneverify = "stonecharts.verify.cli:main"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "markdown-it-py>=3,<5",
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.urls]
Homepage = "https://github.com/dharmik136/stonecharts"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["."]
include = ["stonecharts*"]
