name: Release Task
description: Route release preparation work to the release lane.
title: "[Release]: "
labels: ["role:release", "status:triage", "type:gate", "target:0.0.0.1", "release:0.0.0.1"]
projects: ["dharmik136/2"]
assignees:
  - dharmik136
body:
  - type: textarea
    id: release
    attributes:
      label: Release target
      description: Name the release version or milestone.
    validations:
      required: true
  - type: textarea
    id: gate
    attributes:
      label: Release gate
      description: List the gates, approvals, and evidence required to ship.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected release output
      description: State what should exist at the end of the work.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - WS-01 Governance
        - WS-02 Renderer
        - WS-03 Conformance
        - WS-04 Runtime & A11y
        - WS-05 Customization
        - WS-06 Release
        - WS-07 Docs & DX
        - WS-08 Expansion
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - S0 Foundation
        - S1 Contract Closure
        - S2 Qualification
        - S3 Release Candidate
        - S4 Release
        - S5 Expansion
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target release or stage
      placeholder: 0.0.0.1, S4, post-release, unscheduled
