name: Developer Task
description: Route approved implementation work to the development lane.
title: "[Developer]: "
labels: ["role:developer", "status:triage", "type:work", "target:0.0.0.1"]
projects: ["dharmik136/2"]
assignees:
  - dharmik136
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the verifiable result the developer should produce.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: File scope
      description: Name the files or directories that are in play.
      placeholder: charts/column/, libs/python/, libs/go/, runtime/, docs/
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blocking decisions or dependencies
      description: List the exact approvals or upstream items required first.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name the exact checks that must pass before handoff.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - WS-01 Governance
        - WS-02 Renderer
        - WS-03 Conformance
        - WS-04 Runtime & A11y
        - WS-05 Customization
        - WS-06 Release
        - WS-07 Docs & DX
        - WS-08 Expansion
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - S0 Foundation
        - S1 Contract Closure
        - S2 Qualification
        - S3 Release Candidate
        - S4 Release
        - S5 Expansion
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target release or stage
      placeholder: 0.0.0.1, S1, post-release, unscheduled
