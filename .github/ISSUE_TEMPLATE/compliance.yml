name: Compliance Review
description: Route traceability, approvals, and release-readiness checks to compliance.
title: "[Compliance]: "
labels: ["role:compliance", "status:triage", "type:work", "target:0.0.0.1"]
projects: ["dharmik136/2"]
assignees:
  - dharmik136
body:
  - type: textarea
    id: docs
    attributes:
      label: Documents in scope
      description: Name the docs, decisions, requirements, or release files to inspect.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Compliance check
      description: State what must be consistent or approved.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence to confirm
      description: Describe the evidence or traceability result expected.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - WS-01 Governance
        - WS-02 Renderer
        - WS-03 Conformance
        - WS-04 Runtime & A11y
        - WS-05 Customization
        - WS-06 Release
        - WS-07 Docs & DX
        - WS-08 Expansion
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - S0 Foundation
        - S1 Contract Closure
        - S2 Qualification
        - S3 Release Candidate
        - S4 Release
        - S5 Expansion
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target release or stage
      placeholder: 0.0.0.1, S3, post-release, unscheduled
