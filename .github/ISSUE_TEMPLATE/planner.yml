name: Planner Task
description: Route a bounded decision, scope split, or roadmap question to planning.
title: "[Planner]: "
labels: ["role:planner", "status:triage", "type:decision", "target:0.0.0.1"]
projects: ["dharmik136/2"]
assignees:
  - dharmik136
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the decision or planning outcome in one paragraph.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and sources
      description: List the governing docs, decisions, or release gates.
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Expected outputs
      description: Explain what should be produced for downstream agents.
      placeholder: backlog item, decision note, work split, or handoff
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target release or stage
      placeholder: 0.0.0.1, S1, post-release, unscheduled
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - WS-01 Governance
        - WS-02 Renderer
        - WS-03 Conformance
        - WS-04 Runtime & A11y
        - WS-05 Customization
        - WS-06 Release
        - WS-07 Docs & DX
        - WS-08 Expansion
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - S0 Foundation
        - S1 Contract Closure
        - S2 Qualification
        - S3 Release Candidate
        - S4 Release
        - S5 Expansion
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
