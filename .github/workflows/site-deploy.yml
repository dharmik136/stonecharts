name: site-deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'charts/*/golden/**'
      - 'runtime/chart-interactions.js'
      - 'docs/quality/stoneverify-sample-evidence/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Sync assets and build
        working-directory: site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/

      # Uncomment and configure when Cloudflare Pages is set up:
