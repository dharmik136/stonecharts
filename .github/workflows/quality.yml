name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "jsonschema>=4.23,<5" "markdown-it-py>=3,<5" "PyYAML>=6,<7"
      - run: python tools/check_docs.py

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install "pytest>=8,<10" "jsonschema>=4.23,<5"
      - run: python -m pytest libs/python/tests

  python-wheel-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install "build>=1,<2"
      - run: python -m build --wheel --outdir dist libs/python
      - run: python -m venv /tmp/install-test-venv
      - run: /tmp/install-test-venv/bin/python -m pip install dist/stonecharts-0.0.0.1-py3-none-any.whl
      - name: Smoke-test the installed wheel from a neutral directory
        working-directory: /tmp
        run: |
          /tmp/install-test-venv/bin/python -c "
          import stonecharts
          assert 'site-packages' in stonecharts.__file__, f'resolved from source tree, not the installed wheel: {stonecharts.__file__}'
          from stonecharts import ChartSpec, Axis, Series
          from stonecharts.render import render_svg
          spec = ChartSpec(type='line', title='Install Smoke Test', x_axis=Axis(categories=['Jan','Feb','Mar']), series=[Series(name='S', data=[1.0,2.0,3.0])])
          svg = render_svg(spec)
          assert svg.startswith('<svg'), 'render failed'
          from stonecharts.charts import bar
          bar_spec = ChartSpec(type='bar', title='Bar Smoke Test', x_axis=Axis(categories=['Jan','Feb','Mar']), series=[Series(name='S', data=[1.0,2.0,3.0])])
          bar_svg = render_svg(bar_spec)
          assert bar_svg.startswith('<svg'), 'bar render failed'
          try:
              from stonecharts.charts import scatter
              raise AssertionError('unapproved scatter module present in installed package')
          except ImportError:
              pass
          print('installed-wheel smoke test OK,', len(svg), 'bytes')
          "

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: libs/go/go.mod
          cache-dependency-path: libs/go/go.mod
      - run: go test ./...
