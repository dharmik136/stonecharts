      - README.md documents --junit-report and the GitHub Actions behavior next to the existing StoneVerify usage examples.
    verification: [python -m pytest libs/python/tests/test_stonecharts_verify.py -q, a --demo-drift text run with --junit-report produces a JUnit file with exactly one failure element]

