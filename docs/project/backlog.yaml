  - id: WORK-VERIFY-009
    title: Build a real semantic difference classification model
    item_type: Work Package
    status: Ready
    priority: P0
    workstream: WS-03 Conformance
    stage: S5 Expansion
    target: Unscheduled
    outcome: StoneVerify classifies a detected difference into a named category (input-data, geometry, scale-domain, label-text, theme-style, accessibility-metadata, serialization-only, chart-type-capability, or unknown-structural) with a human-readable description of what changed, replacing the current single likelyCause string derived only from byte/tag-count/line-diff heuristics.
    traceability: [SC-PROD-003, SC-PROD-004, REQ-VERIFY-005]
    risks: []
    evidence: [TEST-DOCS-CONTROL]
    dependencies: [WORK-VERIFY-007]
    compatibility: Extends comparison.json and report.html with new structured fields; keeps the existing likelyCause string for backward compatibility with anything already consuming it.
    areas: [python, docs]
    acceptance:
      - classify_difference() walks the compared SVGs' element/attribute structure per spec/svg-contract.md instead of relying only on tag counts and a line diff.
      - Geometry-affecting attributes (d, cx, cy, r, x, y, points, transform) are classified separately from style/theme attributes (fill, stroke, font-*, class) and from text-content changes.
      - Accessibility metadata changes (role, aria-*, the screen-reader summary) are classified separately from visual changes.
      - A whitespace-only or attribute-ordering-only difference is classified as serialization-only, not left under the generic "attribute, numeric formatting, ordering, or text-content drift" bucket.
      - Each classified difference includes a plain-language description naming the changed element/attribute, not just a byte offset.
      - Existing golden/parity tests and the WORK-VERIFY-002 demo-drift tests still pass unchanged.
    verification: [python -m pytest libs/python/tests/test_stonecharts_verify.py -q, a demo-drift run for each of text/attribute drift modes shows the new category in comparison.json]

