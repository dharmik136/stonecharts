    dependencies: [WORK-VERIFY-007]
    compatibility: Repackages the existing CLI's install and invocation path only; does not change renderer output, the chart spec, golden fixtures, or the proprietary licensing boundary. Distribution to any external party remains gated by DEC-018, which this item does not resolve.
    areas: [python, go, docs]
    acceptance:
      - stoneverify installs as a console-script entry point from a built Python wheel, with no sys.path manipulation and no dependency on the stonecharts repository's directory layout at runtime.
      - The Go render path invokes a prebuilt stoneverify-go-render binary (resolved via --go-binary or an environment variable) instead of go run against a temp file inside the repository's Go module; go run remains available as an explicit --from-source developer fallback.
      - manifest.json's stonechartsVersion and module fields are read from the installed package/binary at runtime, not the hardcoded "0.0.0.4" literal currently in render_go().
