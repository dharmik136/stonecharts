    target: Unscheduled
    outcome: The stoneverify CLI runs against installed Python and Go artifacts instead of the current repo-relative sys.path insert and go run against the checked-out Go module, so it can be installed and run without cloning the stonecharts source tree, and its reported tool/runtime version metadata reflects the actual installed package instead of a hardcoded string.
