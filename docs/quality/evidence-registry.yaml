  - id: BENCH-COMPETITOR-VEGA-20260729
    kind: benchmark
    status: implemented
    description: First measured competitor-benchmark run under SC-PROD-005 against Vega/Vega-Lite server-side rendering - cold-start time, peak memory, cross-invocation consistency, egress, and dependency/CVE surface for one equivalent chart.
    command: npm install vega@5 vega-lite@5 && node render.js vega-lite-spec.json out-vega.svg
    location: docs/quality/competitor-benchmark-results-2026-07.md
    requirements: []
  - id: BENCH-COMPETITOR-HIGHCHARTS-20260729
    kind: benchmark
    status: implemented
    description: First measured competitor-benchmark run under SC-PROD-005 against Highcharts Export Server (Puppeteer/Chromium) - cold-start time, peak memory, cross-invocation consistency, egress, and dependency/CVE surface for one equivalent chart. Extended to the official Docker image (built from source; no pre-built image exists) once a pre-existing local Docker Desktop registry defect was diagnosed and fixed - the Docker cold-start-to-first-render (~6.9s) is faster than the npm-CLI path (~13.6s), correcting this document's earlier unverified guess that Docker would be slower.
    command: npm install highcharts-export-server && node node_modules/highcharts-export-server/bin/cli.js --infile highcharts-config.json --outfile out-highcharts.svg --type svg
    location: docs/quality/competitor-benchmark-results-2026-07.md
    requirements: []
  - id: BENCH-COMPETITOR-QUICKCHART-20260729
    kind: benchmark
    status: implemented
    description: First measured competitor-benchmark run under SC-PROD-005 against QuickChart's hosted API - request latency, cross-invocation consistency, and the inherent data-egress property for one equivalent chart.
    command: 'curl -X POST -H "Content-Type: application/json" -d @quickchart-request.json https://quickchart.io/chart'
    location: docs/quality/competitor-benchmark-results-2026-07.md
    requirements: []
  - id: BENCH-COMPETITOR-ECHARTS-20260729
    kind: benchmark
    status: implemented
    description: Measured competitor-benchmark run under SC-PROD-005 against ECharts' server-side SVG SSR mode (no browser) - cold-start time, peak memory, cross-invocation consistency, egress, and dependency/CVE surface for the line-chart shape.
    command: npm install echarts && node render.js echarts-line-config.json out-echarts.svg
    location: docs/quality/competitor-benchmark-results-2026-07.md
    requirements: []
  - id: BENCH-COMPETITOR-PLOTLY-20260729
    kind: benchmark
    status: implemented
    description: Measured competitor-benchmark run under SC-PROD-005 against Plotly's Kaleido static-export path (drives a real headless browser via choreographer) - cold-start time, peak memory, cross-invocation consistency (found non-deterministic, same class of defect as Highcharts), egress, and dependency/CVE surface (audited in an isolated venv) for the line-chart shape.
    command: pip install plotly kaleido && python plotly_render.py out-plotly.svg
    location: docs/quality/competitor-benchmark-results-2026-07.md
    requirements: []
