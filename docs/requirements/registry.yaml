id: SC-REQ-REGISTRY
version: 3
updated: "2026-08-06"
requirements:
  - id: REQ-PROD-001
    title: One language-neutral chart specification
    statement: StoneCharts MUST represent supported charts with one versioned language-neutral specification consumable by every certified renderer.
    rationale: A shared specification is the product boundary that makes cross-language behavior testable and portable.
    kind: functional
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-PROD-001
    acceptance:
      - One canonical schema is published for the release.
      - Python and Go consume equivalent fields and defaults.
    decisions: [SC-ARCH-ADR-0002]
    contracts: [SC-CON-001, SC-CON-002]
    verification: [TEST-VALIDATION-PARITY]
    implementation: [spec/chart-spec.schema.json, libs/python/stonecharts/spec.py, libs/go/spec.go]

  - id: REQ-SCOPE-001
    title: 0.0.0.1 supports only line and column
    statement: The 0.0.0.1 active schema MUST expose only line and column chart types; design-only chart types MUST remain non-normative.
    rationale: Passing validation for an unrenderable chart breaks the public contract and creates runtime failures.
    kind: constraint
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-PROD-002
    acceptance:
      - The active type enum contains line and column only.
      - Every other type is rejected before rendering with a canonical error.
    decisions: [SC-ARCH-ADR-0002]
    contracts: [SC-CON-002]
    verification: [TEST-CAPABILITY-MATRIX]
    implementation: [spec/chart-spec.schema.json, libs/python/stonecharts/validate.py, libs/go/validate.go]

  - id: REQ-DET-001
    title: Canonical SVG byte parity
    statement: Certified renderers MUST produce identical canonical SVG bytes for every specification in the release conformance corpus.
    rationale: Byte identity is the internal oracle for detecting cross-language serialization and geometry drift.
    kind: quality
    priority: must
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-CON-001
    acceptance:
      - Python output equals every approved golden byte for byte.
      - Go output equals the same approved goldens byte for byte.
      - A direct Python-to-Go cross-render sweep reports no differences.
    decisions: [SC-ARCH-ADR-0001]
    contracts: [SC-CON-001, SC-CON-003]
    verification: [TEST-PYTHON-GOLDENS, TEST-GO-GOLDENS, TEST-DIRECT-CROSS-RENDER]
    implementation: [libs/python/stonecharts, libs/go, charts/line-basic/golden, charts/column/golden, charts/area/golden]

  - id: REQ-VAL-001
    title: Cross-language validation parity
    statement: The schema, Python validator, and Go validator MUST implement one ratified acceptance domain and canonical error semantics.
    rationale: Identical rendering is irrelevant when language entry points disagree about which input is legal.
    kind: quality
    priority: must
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-CON-002
    acceptance:
      - Shared valid fixtures are accepted by the schema and both validators.
      - Shared invalid fixtures are rejected with equivalent error codes and paths.
      - Empty series, dimensions, category lengths, and unknown fields have explicit rules.
    decisions: [SC-ARCH-ADR-0002]
    contracts: [SC-CON-002]
    verification: [TEST-VALIDATION-PARITY]
    implementation: [spec/chart-spec.schema.json, libs/python/stonecharts/validate.py, libs/go/validate.go]

  - id: REQ-CAP-001
    title: Capability failures are typed and non-fatal
    statement: Renderer entry points MUST return a canonical typed error for unsupported capabilities and MUST NOT panic, crash, or emit partial output for user-controlled input.
    rationale: Capability negotiation is distinct from schema validity and must be safe across renderer versions.
    kind: functional
    priority: must
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-CON-002
    acceptance:
      - A machine-readable capability manifest exists for Python and Go.
      - Unsupported type and feature fixtures return canonical errors.
      - Fuzzed invalid input causes no unhandled exception or panic.
    decisions: [SC-ARCH-ADR-0002]
    contracts: [SC-CON-002]
    verification: [TEST-CAPABILITY-MATRIX]
    implementation: [libs/python/stonecharts/render.py, libs/go/render.go]

  - id: REQ-STACK-001
    title: Diverging normal stacks
    statement: Normal stacking MUST accumulate positive and negative values independently from the zero baseline in both domain and mark calculations.
    rationale: A shared accumulator produces invalid geometry when signs differ within a category.
    kind: functional
    priority: must
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-ARCH-ADR-0003
    acceptance:
      - Positive segments stack upward from zero.
      - Negative segments stack downward from zero.
      - Every emitted rectangle stays within the computed plot domain unless explicitly clipped by an axis override.
    decisions: [SC-ARCH-ADR-0003]
    contracts: [SC-CON-002]
    verification: [TEST-STACK-SIGNED]
    implementation: [libs/python/stonecharts/charts/_cartesian.py, libs/python/stonecharts/charts/column.py, libs/go/cartesian.go, libs/go/column.go]

  - id: REQ-STACK-002
    title: Unambiguous percent stacking
    statement: 0.0.0.1 percent stacking MUST accept only finite non-negative values and MUST render an all-zero category as zero-height zero-percent segments.
    rationale: Net-sum and absolute-sum conventions assign different meanings to signed data; 0.0.0.1 must not choose silently.
    kind: constraint
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-ARCH-ADR-0003
    acceptance:
      - Any negative value in a percent stack is rejected consistently.
      - An all-zero category emits no NaN or infinity and represents every share as zero.
      - Positive categories normalize to one hundred percent within the defined numeric tolerance.
    decisions: [SC-ARCH-ADR-0003]
    contracts: [SC-CON-002]
    verification: [TEST-PERCENT-DOMAIN]
    implementation: [libs/python/stonecharts/validate.py, libs/go/validate.go, libs/python/stonecharts/charts/column.py, libs/go/column.go]

  - id: REQ-LAYOUT-001
    title: Deterministic manual layout controls
    statement: 0.0.0.1 MUST provide deterministic validated manual margins and MUST NOT claim automatic text fitting.
    rationale: Host text measurement is not stable enough for the canonical byte profile, while fixed margins can clip real data.
    kind: functional
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-ARCH-ADR-0005
    acceptance:
      - Margin values are finite and non-negative.
      - Invalid remaining plot dimensions are rejected before render.
      - Defaults preserve approved line and column output.
      - Overflow and no-auto-fit limitations are published.
    decisions: [SC-ARCH-ADR-0005]
    contracts: [SC-CON-005, SC-CON-006]
    verification: [TEST-LAYOUT-MARGINS]
    implementation: [spec/chart-spec.schema.json, libs/python/stonecharts/charts/_cartesian.py, libs/go/cartesian.go]

  - id: REQ-RUNTIME-001
    title: Invariant interaction semantics
    statement: Interactive output MUST preserve canonical tooltip content, navigation state transitions, legend state, and ARIA DOM updates while allowing viewport-dependent placement.
    rationale: Browser presentation must adapt without changing the meaning or observable state of an interaction.
    kind: functional
    priority: must
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-CON-004
    acceptance:
      - Keyboard navigation and escape behavior match the runtime state table.
      - Legend operation is available to pointer and keyboard users.
      - Tooltip content derives only from canonical data attributes.
      - Placement stays within the declared container without fixed cross-viewport coordinates.
    decisions: [SC-ARCH-ADR-0004]
    contracts: [SC-CON-003, SC-CON-004]
    verification: [TEST-RUNTIME-SMOKE, TEST-RUNTIME-BROWSER]
    implementation: [runtime/chart-interactions.js, spec/svg-contract.md]

  - id: REQ-A11Y-001
    title: Accessible chart alternatives and operation
    statement: Interactive HTML MUST provide a concise chart description, a complete semantic data alternative, and keyboard-operable interactive controls for the declared accessibility profile.
    rationale: SVG text and visual marks alone do not expose sufficient chart meaning or operation to assistive technology.
    kind: quality
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-CON-007
    acceptance:
      - SVG has a tested accessible name and description.
      - The data table represents every rendered series/category value safely.
      - Keyboard focus is visible, ordered, and not trapped.
      - Component claims are scoped rather than asserting whole-page WCAG conformance.
    decisions: [SC-ARCH-ADR-0004]
    contracts: [SC-CON-003, SC-CON-004, SC-CON-007]
    verification: [TEST-RUNTIME-SMOKE, TEST-RUNTIME-BROWSER, REVIEW-ACCESSIBILITY-MANUAL]
    implementation: [runtime/chart-interactions.js, libs/python/stonecharts/render.py, libs/go/render.go]

  - id: REQ-VIS-001
    title: Explicit visual reproducibility profiles
    statement: StoneCharts MUST distinguish canonical SVG identity, embedded-font consistency, and certified pixel export in all product claims.
    rationale: Identical SVG bytes do not guarantee identical rasterized pixels across fonts, browsers, operating systems, and converters.
    kind: quality
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-CON-006
    acceptance:
      - Default host-font limitations are documented.
      - Any embedded font is one prebuilt licensed artifact with a recorded hash.
      - Pixel claims name the exact certified environment and tolerance.
    decisions: [SC-ARCH-ADR-0001, SC-ARCH-ADR-0005]
    contracts: [SC-CON-001, SC-CON-006]
    verification: [REVIEW-VISUAL-PROFILE]
    implementation: [docs/contracts/typography-and-export-profiles.md]

  - id: REQ-CUST-001
    title: Deterministic customization boundary
    statement: Features inside a certified guarantee profile MUST be expressible as structured validated data and MUST render without arbitrary executable code or raw DOM mutation.
    rationale: Personalization is central to the product, but unbounded injection defeats portability, security, and parity.
    kind: constraint
    priority: must
    status: implemented
    owner: product-owner
    target: 0.0.0.1
    source: SC-CON-005
    acceptance:
      - Supported themes and style primitives are represented in the schema.
      - Unknown or unsafe customization has a documented error or downgrade behavior.
      - Future escape hatches are explicitly outside certified guarantees.
    decisions: [SC-ARCH-ADR-0001]
    contracts: [SC-CON-001, SC-CON-005]
    verification: [TEST-VALIDATION-PARITY, TEST-XSS-ESCAPING]
    implementation: [spec/chart-spec.schema.json, spec/themes]

  - id: REQ-SEC-001
    title: Untrusted specification safety
    statement: Renderers and the shared runtime MUST treat every specification string and style value as untrusted input and prevent markup, script, URL, and style injection.
    rationale: Self-contained HTML and SVG place user-controlled values near executable and styling contexts.
    kind: security
    priority: must
    status: implemented
    owner: security-contact
    target: 0.0.0.1
    source: SC-SEC-001
    acceptance:
      - Hostile text cannot create executable markup in SVG or HTML.
      - Style-bearing fields have explicit validation or safe encoding rules.
      - Security regressions block release.
    decisions: []
    contracts: [SC-CON-005]
    verification: [TEST-XSS-ESCAPING]
    implementation: [libs/python/stonecharts/util.py, libs/go/util.go, runtime/chart-interactions.js]

  - id: REQ-REL-001
    title: Immutable release qualification evidence
    statement: Every distributed release MUST include or reference an immutable manifest containing source revision, versions, toolchains, artifact hashes, test results, known limits, SBOM, and provenance status.
    rationale: Claims must be auditable against the exact artifacts delivered to users.
    kind: delivery
    priority: must
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-REL-001
    acceptance:
      - Product, Python, and Go versions follow their ecosystem formats and map to one release.
      - Every package and evidence artifact has a SHA-256 hash.
      - Failed, skipped, and unavailable evidence is visible in the manifest.
    decisions: []
    contracts: [SC-CON-001]
    verification: [TEST-RELEASE-EVIDENCE]
    implementation: [docs/releases/0.0.0.1/evidence/manifest.schema.json, tools/build_release_evidence.py, tools/check_release_evidence.py]

  - id: REQ-PERF-001
    title: Reproducible performance qualification
    statement: Release performance claims MUST be produced by the approved benchmark protocol with recorded workload, environment, samples, variance, and artifact revision.
    rationale: Uncontrolled benchmark numbers are not comparable and create misleading promises.
    kind: quality
    priority: should
    status: implemented
    owner: maintainer
    target: 0.0.0.1
    source: SC-QUAL-002
    acceptance:
      - Small, business, and stress workloads are defined and versioned.
      - Render time, memory, and output size are recorded for Python and Go.
      - Absolute budgets are approved only after a stable baseline exists.
    decisions: []
    contracts: []
    verification: [BENCH-RENDER-BASELINE]
    implementation: [libs/python/benchmark.py, libs/go/cmd/benchmark/main.go]

  - id: REQ-CHART-001
    title: Admit bar as a certified 0.0.0.2 chart type
    statement: Bar MUST be admitted through the full chart admission checklist (SC-ARCH-011) and reach Certified status per the renderer constitution before 0.0.0.2 documentation may describe it as supported.
    rationale: DEC-014 authorizes bar as the next expansion target; the admission checklist exists precisely so authorization does not get conflated with completion.
    kind: functional
    priority: must
    status: verified
    owner: maintainer
    target: 0.0.0.2
    source: SC-ARCH-011
    acceptance:
      - Schema, Python, and Go accept and reject bar specs identically (mirrors REQ-VAL-001's contract, extended to bar).
      - Bar output byte-matches its golden corpus in both languages, and the direct cross-render sweep includes bar with zero diff (mirrors REQ-DET-001).
      - Bar's accessible data table and XSS/injection coverage match the standard already proven for line, column, and area (mirrors REQ-A11Y-001, REQ-SEC-001).
      - Bar is added to the benchmark workload matrix across all four approved profiles (mirrors REQ-PERF-001).
      - Chart-admission-checklist.md phases 1-9 (design through release-evidence-adjacent documentation) are closed before this requirement moves to verified. Phase 10 (the immutable release evidence pack) is GATE-S7's concern, not this requirement's - mirroring how REQ-REL-001 was a separate concern from REQ-DET-001/REQ-A11Y-001/etc. in the 0.0.0.1 cycle, not bundled into each of them individually.
    decisions: []
    contracts: []
    verification: [TEST-PYTHON-GOLDENS, TEST-GO-GOLDENS, TEST-DIRECT-CROSS-RENDER, TEST-XSS-ESCAPING, TEST-RUNTIME-BROWSER, BENCH-RENDER-BASELINE, REVIEW-BAR-ACCESSIBILITY-SECURITY, BENCH-BAR-BASELINE]
    implementation: [libs/python/stonecharts/charts/bar.py, libs/go/bar.go, charts/bar/golden, charts/bar/invalid-fixtures.json, runtime/bar-browser-qualification.test.js]

  - id: REQ-CHART-002
    title: Admit scatter as a certified 0.0.0.3 chart type
    statement: Scatter MUST be admitted through the full chart admission checklist (SC-ARCH-011) and reach Certified status per the renderer constitution before 0.0.0.3 documentation may describe it as supported. Because scatter lands the shared point model and numeric x-scale, every existing golden (line, column, area, bar) MUST remain byte-identical after the change, proven by diff, not asserted.
    rationale: DEC-015 authorizes scatter as the next expansion target; scatter is rank 3 in the roadmap's own build order and the first sibling to force a shared-frame generalization rather than an isolated marks function, so its admission carries a stricter no-regression bar than bar's.
    kind: functional
    priority: must
    status: verified
    owner: maintainer
    target: 0.0.0.3
    source: SC-ARCH-011
    acceptance:
      - The point-model data element type (object {x,y}, positional [x,y], and the pinned bare-number fast path x=index) is registered identically in the schema, Python validator, and Go validator (mirrors REQ-VAL-001's contract, extended with a new element shape).
      - The numeric linear x-scale (nice_ticks + fmt_num reused with include_zero=False, degenerate single-value domain pinned before any divide) is implemented identically in both languages.
      - Byte-identity gate - after the point model and numeric x-scale land, every existing golden fixture (line, column, area, bar) is unchanged (git diff empty) and every one cross-renders Py==Go with zero diff. This is verified before any scatter-specific golden is added, not alongside it.
      - Scatter output byte-matches its golden corpus in both languages, and the direct cross-render sweep includes scatter with zero diff (mirrors REQ-DET-001).
      - Scatter's accessible data table is generalized to render (x,y) pairs rather than a coerced single number, in lockstep in both languages, and scatter's XSS/injection coverage matches the standard already proven for line, column, area, and bar (mirrors REQ-A11Y-001, REQ-SEC-001).
      - Scatter is added to the benchmark workload matrix across all four approved profiles (mirrors REQ-PERF-001).
      - Chart-admission-checklist.md phases 1-9 (design through release-evidence-adjacent documentation) are closed before this requirement moves to verified. Phase 10 (the immutable release evidence pack) is GATE-S10's concern, not this requirement's, mirroring the 0.0.0.2 cycle's REQ-CHART-001/GATE-S7 split.
    decisions: []
    contracts: []
    verification: [TEST-PYTHON-GOLDENS, TEST-GO-GOLDENS, TEST-DIRECT-CROSS-RENDER, TEST-XSS-ESCAPING, TEST-RUNTIME-BROWSER, BENCH-RENDER-BASELINE, REVIEW-SCATTER-ACCESSIBILITY-SECURITY, BENCH-SCATTER-BASELINE]
    implementation: [libs/python/stonecharts/charts/scatter.py, libs/go/scatter.go, charts/scatter/golden, charts/scatter/invalid-fixtures.json, runtime/scatter-browser-qualification.test.js]

  - id: REQ-CHART-003
    title: Admit bubble as a certified 0.0.0.4 chart type
    statement: Bubble MUST be admitted through the full chart admission checklist (SC-ARCH-011) and reach Certified status per the renderer constitution before 0.0.0.4 documentation may describe it as supported.
    rationale: DEC-016 authorizes bubble as the next expansion target; bubble is rank 4 in the roadmap's own build order and rides scatter's numeric x-scale and point model verbatim, adding exactly one net-new generalization (the size-scale) rather than a shared-frame change, so its admission is comparable in shape to bar's, not scatter's.
    kind: functional
    priority: must
    status: verified
    owner: maintainer
    target: 0.0.0.4
    source: SC-ARCH-011
    acceptance:
      - The point model is extended with an optional z field (Datum gains z, unused/nil for every existing chart type including scatter) and registered identically in the schema, Python validator, and Go validator for bubble's {x,y,z} object and [x,y,z] positional forms.
      - The size-scale (global z-domain reduction across all series, r = RMIN + (RMAX-RMIN)*sqrt(clamp01((z-zmin)/(zmax-zmin))), degenerate zmax<=zmin pinned to the fixed (RMIN+RMAX)/2 before any divide) is implemented identically in both languages.
      - Byte-identity gate - after the Datum.z field addition, every existing golden fixture (line, column, area, bar, scatter) is unchanged (git diff empty) and every one cross-renders Py==Go with zero diff. This is verified before any bubble-specific golden is added, not alongside it.
      - Bubble output byte-matches its golden corpus in both languages, and the direct cross-render sweep includes bubble with zero diff (mirrors REQ-DET-001).
      - Bubble's accessible data table is generalized to render (x,y,z) triples rather than a coerced single number or (x,y) pair, in lockstep in both languages, and bubble's XSS/injection coverage matches the standard already proven for line, column, area, bar, and scatter (mirrors REQ-A11Y-001, REQ-SEC-001).
      - Bubble is added to the benchmark workload matrix across all four approved profiles (mirrors REQ-PERF-001).
      - Chart-admission-checklist.md phases 1-9 (design through release-evidence-adjacent documentation) are closed before this requirement moves to verified. Phase 10 (the immutable release evidence pack) is GATE-S13's concern, not this requirement's, mirroring the 0.0.0.2/0.0.0.3 cycles.
    decisions: []
    contracts: []
    verification: [TEST-PYTHON-GOLDENS, TEST-GO-GOLDENS, TEST-DIRECT-CROSS-RENDER, TEST-XSS-ESCAPING, TEST-RUNTIME-BROWSER, BENCH-RENDER-BASELINE, REVIEW-BUBBLE-ACCESSIBILITY-SECURITY, BENCH-BUBBLE-BASELINE]
    implementation: [libs/python/stonecharts/charts/bubble.py, libs/go/bubble.go, charts/bubble/golden, charts/bubble/invalid-fixtures.json, runtime/bubble-browser-qualification.test.js]

  - id: REQ-VERIFY-001
    title: Repository-independent StoneVerify execution
    statement: StoneVerify MUST install and execute without requiring the StoneCharts repository's source-tree layout, without runtime source compilation via go run, and without any outbound network access.
    rationale: A verification tool a customer cannot install without cloning proprietary source cannot be used in an external evaluation or pilot.
    kind: constraint
    priority: must
    status: verified
    owner: maintainer
    target: StoneVerify Pilot-Ready v1
    source: SC-PROD-003
    acceptance:
      - stoneverify installs as a package with a console-script entry point, independent of the stonecharts repository's directory layout at runtime.
      - The Go render path uses a prebuilt binary instead of go run against a temporary file inside the repository's Go module.
      - No stoneverify invocation makes an outbound network call.
    decisions: []
    contracts: []
    verification: [TEST-STONEVERIFY-INSTALL]
    implementation: [tools/stonecharts_verify.py, libs/python/stonecharts]

  - id: REQ-VERIFY-002
    title: Versioned StoneVerify result contract
    statement: Every StoneVerify comparison MUST emit one schema-versioned result object describing comparison status, inputs, runtimes, evidence identities, semantic findings, and failure reason, consumed identically by every output format.
    rationale: Without one canonical internal result model, JSON, JUnit, HTML, and terminal output can drift into inconsistent interpretations of the same comparison.
    kind: functional
    priority: must
    status: verified
    owner: maintainer
    target: StoneVerify Pilot-Ready v1
    source: SC-PROD-003
    acceptance:
      - A single internal result structure carries schemaVersion, status, comparisonMode, baseline, candidate, inputs, runtimeCoverage, findings, evidence, and environment.
      - Every output adapter (JSON, JUnit, HTML, terminal) is built from that one structure, not from separately constructed dictionaries.
      - The schema version is recorded in every emitted manifest so a consumer can detect a future breaking change.
    decisions: []
    contracts: []
    verification: [TEST-STONEVERIFY-RESULT-SCHEMA]
    implementation: [tools/stonecharts_verify.py]

  - id: REQ-VERIFY-003
    title: StoneVerify baseline and candidate integrity
    statement: A baseline-versus-candidate comparison MUST identify exactly which approved baseline and candidate evidence bundles were used, including their content hashes and tool and runtime versions.
    rationale: A comparison result is not auditable evidence unless it names precisely which two artifacts were compared and with which tool version.
    kind: quality
    priority: must
    status: verified
    owner: maintainer
    target: StoneVerify Pilot-Ready v1
    source: SC-PROD-003
    acceptance:
      - Every comparison result records the baseline and candidate evidence directory, their manifest hashes, and the stoneverify tool version used for each side.
      - A baseline produced by a different stoneverify tool version is flagged, not silently compared.
    decisions: []
    contracts: []
    verification: [TEST-STONEVERIFY-BASELINE-INTEGRITY]
    implementation: [tools/stonecharts_verify.py]

  - id: REQ-VERIFY-004
    title: Stable StoneVerify automation behavior
    statement: StoneVerify's documented exit codes and machine-readable output formats MUST remain backward-compatible within a supported release line, with any breaking change requiring a new major schema version.
    rationale: CI systems and scripts depend on exit codes and output shape; silently changing them breaks every existing integration.
    kind: constraint
    priority: must
    status: verified
    owner: maintainer
    target: StoneVerify Pilot-Ready v1
    source: SC-PROD-003
    acceptance:
      - Exit codes for comparison-fail, usage-error, and bad-input are documented and covered by tests that fail if the mapping changes unintentionally.
      - A change to the JSON or JUnit output shape bumps schemaVersion rather than silently altering the existing shape.
    decisions: []
    contracts: []
    verification: [TEST-STONEVERIFY-EXIT-CODES]
    implementation: [tools/stonecharts_verify.py, README.md]

  - id: REQ-VERIFY-005
    title: Semantic StoneVerify difference classification
    statement: StoneVerify MUST classify a detected SVG difference into a named category grounded in the governed chart and SVG contracts, using an explicit unknown category when the cause cannot be determined confidently, rather than only reporting byte or tag-count differences. Every comparison MUST additionally report one of three equality levels - byte equal, structurally equal, or semantically equal - so a serialization-only change is distinguishable from a real content change without weakening the existing byte-parity guarantee for certified Python-Go fixtures (REQ-DET-001). A fourth level, perceptual equality under a controlled export profile, is an explicitly out-of-scope future extension, not part of this requirement.
    rationale: A product sold on explaining chart drift must classify what changed, not only that something changed, and must be able to say a change was cosmetic without implying the underlying content is unverified.
    kind: functional
    priority: must
    status: verified
    owner: maintainer
    target: StoneVerify Pilot-Ready v1
    source: SC-PROD-003
    acceptance:
      - Each finding is classified as one of input-data, geometry, scale-domain, label-text, theme-style, accessibility-metadata, serialization-only, chart-type-capability, or unknown-structural.
      - Each finding also reports an equality level (byte, structural, or semantic) and a confidence level (high, medium, or low) with the specific evidence (basis) that produced the classification.
      - The unknown-structural category is used, with confidence low, when classification confidence is low, rather than forcing a difference into an incorrect specific category.
      - Classification is grounded in spec/svg-contract.md's element and attribute contract, not ad hoc heuristics.
    decisions: []
    contracts: []
    verification: [TEST-STONEVERIFY-SEMANTIC-DIFF]
    implementation: [tools/stonecharts_verify.py, spec/svg-contract.md]
